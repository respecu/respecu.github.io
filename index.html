<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starly - Support</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <script>
    const userLang = navigator.language || navigator.userLanguage || "en";
    const language = userLang.toLowerCase().startsWith("ko") ? "ko" : "en";
    const target = new URL(language + "/", window.location.href);
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</head>
<body>
  <div class="container">
    <h1>Starly</h1>
    <p class="tagline">Choose your language / <span lang="ko">언어를 선택하세요.</span></p>
    <nav class="language-switcher" aria-label="Language / 언어 선택">
      <a href="en/" lang="en" hreflang="en">English</a>
      <a href="ko/" lang="ko" hreflang="ko">한국어</a>
    </nav>
  </div>
</body>
</html>
