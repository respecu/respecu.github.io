    <h1>Starly</h1>
    <p class="tagline">
      가짜 5점 리뷰는 그만. 소셜 없이, 나만 보는 솔직한 평가 기록 앱.
    </p>

    <ul>
      <li>0.5점 단위(반별)로 빠르고 솔직한 평점 기록</li>
      <li>사진 & 메모로 “미래의 나”를 위한 기록</li>
      <li>음식/영화/음악/책/게임/여행/장소/운동/제품 등 카테고리별 관리</li>
      <li>내 평균 평점, 카테고리별 통계, 분포로 내 취향 보기</li>
      <li>검색/필터(예: 1점만 보기)로 과거 기록 즉시 찾기</li>
    </ul>
